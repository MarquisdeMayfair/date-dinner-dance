<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080d" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Date Dinner Dance" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Date · Dinner · Dance</title>
    <meta
      name="description"
      content="Spin your night. Three reels — a date spot, a dinner, a dancefloor. Share it in a DM or Story."
    />
    <link rel="canonical" href="https://datedinnerdance.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Date · Dinner · Dance" />
    <meta property="og:title" content="Date · Dinner · Dance" />
    <meta
      property="og:description"
      content="Spin three reels: date, dinner, dance. Share the night in a DM or Story."
    />
    <meta property="og:url" content="https://datedinnerdance.com/" />
    <meta property="og:image" content="https://datedinnerdance.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Date · Dinner · Dance" />
    <meta
      name="twitter:description"
      content="Spin your night. Date, dinner, dance — then share the link."
    />
    <meta name="twitter:image" content="https://datedinnerdance.com/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/cities.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/ibiza.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="app">
      <header class="hero">
        <div class="city-wrap">
          <button type="button" class="city-chevron" data-dir="-1" aria-label="Previous city">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="city-scroller" class="city-scroller" role="tablist" aria-label="Cities"></div>
          <button type="button" class="city-chevron" data-dir="1" aria-label="Next city">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6 15.5 12l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div id="city-dots" class="city-dots" aria-hidden="true"></div>
        <h1>Date · Dinner · Dance</h1>
        <p class="tagline">Spin your night. Nudge until it feels right.</p>
      </header>

      <main id="reels" class="reels"></main>

      <footer class="dock">
        <button type="button" id="share" class="share-btn" aria-label="Share this night">
          Share
        </button>
        <button type="button" id="spin" class="spin">
          <span class="spin-label">Spin</span>
        </button>
      </footer>
    </div>

    <div id="share-sheet" class="sheet" hidden>
      <div class="sheet-card">
        <button type="button" class="sheet-close" data-close-sheet aria-label="Close">×</button>
        <p class="sheet-kicker">Share this night</p>
        <h2 id="share-title">Date · Dinner · Dance</h2>
        <p id="share-picks" class="sheet-picks"></p>
        <div class="share-actions">
          <button type="button" id="share-native" class="share-action">Share</button>
          <button type="button" id="share-copy" class="share-action">Copy link</button>
          <button type="button" id="share-dm" class="share-action">Instagram DM</button>
          <button type="button" id="share-story" class="share-action">Add to Story</button>
        </div>
        <p id="share-status" class="sheet-status" aria-live="polite"></p>
        <form id="subscribe-form" class="subscribe">
          <p class="sheet-kicker">Get new cities first</p>
          <label class="sr-only" for="subscribe-email">Email</label>
          <input id="subscribe-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@email.com" required />
          <label class="sr-only" for="subscribe-handle">Instagram handle</label>
          <input id="subscribe-handle" name="handle" type="text" autocomplete="username" placeholder="@yourhandle (optional)" />
          <button type="submit" class="subscribe-btn">Notify me</button>
          <p class="subscribe-note">No spam. We’ll send nights and new cities — not ads.</p>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
